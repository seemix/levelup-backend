services:
  payload:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: mongodb://mongo:27017/levelup?replicaSet=rs0
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      FRONTEND_URL: ${FRONTEND_URL:-}
      BACKEND_URL: ${BACKEND_URL:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    volumes:
      - media:/app/media
    depends_on:
      mongo:
        condition: service_healthy

  # Single-node replica set: required for MongoDB transactions used by Payload.
  mongo:
    image: mongo:8
    ports:
      - '27017:27017'
    command: ['--replSet', 'rs0', '--bind_ip_all']
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 10
    volumes:
      - data:/data/db

volumes:
  data:
  media:
